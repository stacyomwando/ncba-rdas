apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdas
  namespace: rdas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rdas
  template:
    metadata:
      labels:
        app: rdas
    spec:
      containers:
        - name: rdas
          image: ncba/rdas:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rdas-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
