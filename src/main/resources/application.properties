spring.application.name=rdas
server.port=8080

soap.service.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso

cache.ttl.hours=24

management.endpoints.web.exposure.include=health,info,caches,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

resilience4j.circuitbreaker.instances.soapService.sliding-window-size=5
resilience4j.circuitbreaker.instances.soapService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.soapService.wait-duration-in-open-state=30s
resilience4j.retry.instances.soapService.max-attempts=3
resilience4j.retry.instances.soapService.wait-duration=2s
